<meta charset="utf-8">
<title>The Room</title>
<style>
  html,body{margin:0;padding:0;background:#000;width:1080px;height:1920px;overflow:hidden}
  #gl{display:block;width:1080px;height:1920px}
</style>
<canvas id="gl" width="1080" height="1920"></canvas>
<script>
// ============================================================================
// THE ROOM — a music visualiser. The sound drives the motion.
//
// Same contract as 001 and 003: one deterministic window.renderFrame(t) puts the
// whole frame at time t, so the render is reproducible and a range can be redone.
// The scene is a raymarched SDF and the fisheye is a real lens — the barrel is
// applied to the ray direction BEFORE marching, so edges bend the way a lens
// bends them and nothing is resampled.
// ============================================================================
const W=1080, H=1920;
const BPM=128.0, BEAT=60/BPM, BAR=4*BEAT;      // 0.46875, 1.875
const BARS=16, DUR=BARS*BAR;                   // 30.0 s exactly
const bt=n=>n*BEAT, br=n=>(n-1)*BAR;

// section boundaries, in bars (see BRIEF.md)
const SEC=[ {name:'booth',    a:br(1),  b:br(4)  },
            {name:'room',     a:br(4),  b:br(8)  },
            {name:'specimen', a:br(8),  b:br(10) },
            {name:'paint',    a:br(10), b:br(14) },
            {name:'wave',     a:br(14), b:br(17) } ];

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,u)=>a+(b-a)*u;

// ---------------------------------------------------------------- the audio
// Path A: the bands are derived from the 128 BPM grid, because tech house IS the
// grid. Path B: analyse.py writes bands.json from a real file and it is used
// instead, unchanged everywhere downstream.
let BANDS=null;                                 // {fps, sub[], low[], mid[], high[], kick[]}
window.loadBands=function(j){ BANDS=j; };

function gridBands(t){
  const beat=t/BEAT, ph=beat-Math.floor(beat);   // 0..1 within the beat
  const bar=(t-br(1))/BAR, barPh=bar-Math.floor(bar);
  const sec=sectionAt(t);
  // the arrangement: the kick is out during the specimen build, back on the drop
  const kickOn = !(sec.name==='specimen' && t> sec.a+BAR*0.5) && sec.name!=='wave';
  const kick = kickOn ? Math.exp(-ph*7.0) : 0.0;
  // the offbeat open hat
  const hat = Math.exp(-Math.abs(ph-0.5)*26.0);
  // rolling sub: present under everything except the build's last bar
  const roll = 0.55+0.45*Math.sin(beat*Math.PI*2*0.5);
  const sub  = kickOn ? (0.35+0.65*kick)*roll : 0.12;
  const mid  = 0.25+0.55*hat + (sec.name==='paint'?0.25:0);
  const high = 0.20+0.70*hat;
  // the riser through the specimen build, released on the drop
  const rise = sec.name==='specimen' ? clamp((t-sec.a)/(sec.b-sec.a)) : 0;
  return {sub, low:kick, mid, high, kick, rise, barPh, beatPh:ph};
}
function bands(t){
  if(!BANDS) return gridBands(t);
  const i=Math.min(BANDS.sub.length-1, Math.max(0, Math.round(t*BANDS.fps)));
  const g=gridBands(t);
  return {sub:BANDS.sub[i], low:BANDS.low[i], mid:BANDS.mid[i], high:BANDS.high[i],
          kick:BANDS.kick[i], rise:g.rise, barPh:g.barPh, beatPh:g.beatPh};
}
function sectionAt(t){
  for(const s of SEC) if(t>=s.a && t<s.b) return s;
  return SEC[SEC.length-1];
}

// ---------------------------------------------------------------- webgl
const cv=document.getElementById('gl');
const gl=cv.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true,alpha:false});

const VS=`#version 300 es
in vec2 p; out vec2 uv;
void main(){ uv=p; gl_Position=vec4(p,0.,1.); }`;

const FS=`#version 300 es
precision highp float;
in vec2 uv; out vec4 outc;

uniform float uT;          // seconds
uniform float uSec;        // 0 booth, 1 room, 2 specimen, 3 paint, 4 wave
uniform float uSecP;       // 0..1 progress through the section
uniform float uSub, uMid, uHigh, uKick, uRise;
uniform vec3  uShake;      // camera shake offset
uniform float uBarrel;     // lens strength — breathes with the sub
uniform float uLamp;       // lamp intensity
uniform float uAspect;
uniform float uPitch;      // camera tilt, radians — the booth looks down at the deck

const float PI=3.14159265;

// ---- sdf primitives -------------------------------------------------------
float sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return min(max(q.x,max(q.y,q.z)),0.)+length(max(q,0.)); }
float sdCap(vec3 p, float h, float r){ p.y-=clamp(p.y,-h,h); return length(p)-r; }
float sdSph(vec3 p, float r){ return length(p)-r; }
float sdCyl(vec3 p, float h, float r){
  vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h);
  return min(max(d.x,d.y),0.)+length(max(d,0.)); }

float hash(vec2 p){ return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5453); }

// ---- the scene ------------------------------------------------------------
// Returns distance; MAT is set to what was hit.
// 0 room shell · 1 booth · 2 crowd · 3 lamp · 4 deck · 5 jog wheel · 6 mixer · 7 waveform bar
float MAT;
const float FLOORY=-1.70;      // the floor of the room

float mapRoom(vec3 p){
  float d=-sdBox(p-vec3(0.,1.2,1.0), vec3(5.2,2.9,12.5));   // the shell, inverted
  MAT=0.;
  // the booth: a slab across the far end, with the deck on top
  float booth=sdBox(p-vec3(0.,-0.72,7.30), vec3(1.42,0.72,0.50));
  if(booth<d){ d=booth; MAT=1.; }
  float deck=sdBox(p-vec3(0.,0.02,7.24), vec3(1.28,0.045,0.40));
  if(deck<d){ d=deck; MAT=4.; }
  // the two jog wheels — the only thing in the room that is actually turning
  vec3 jl=p-vec3(-0.76,0.08,7.20), jr=p-vec3(0.76,0.08,7.20);
  float jog=min(sdCyl(jl,0.030,0.285), sdCyl(jr,0.030,0.285));
  if(jog<d){ d=jog; MAT=5.; }
  float mixer=sdBox(p-vec3(0.,0.08,7.20), vec3(0.26,0.032,0.32));
  if(mixer<d){ d=mixer; MAT=6.; }
  // the crowd — people standing ON the floor, between the camera and the booth,
  // with a clear channel down the middle so the lamp is never blocked
  vec3 q=p;
  vec2 cell=vec2(1.28,1.55);
  vec2 id=floor(q.xz/cell+0.5);
  vec2 lp=q.xz-cell*id;
  float h1=hash(id), h2=hash(id+7.7), h3=hash(id-3.1);
  bool keep = uSec<3.5 && abs(id.x)<4.5 && id.y>=-1.5 && id.y<=3.4 && h3>0.20;
  if(abs(id.x)<0.85) keep=false;      // the aisle: the camera never flies through a body
  if(keep){
    vec3 c=vec3(lp.x+(h1-0.5)*0.40, q.y-(FLOORY+0.70+h2*0.07), lp.y+(h2-0.5)*0.46);
    c.x-=sin(uT*1.7+h1*6.28)*0.075;          // a slow sway
    c.y-=uKick*0.048*(0.5+h2);               // and a bob on the kick
    float person=min(sdCap(c, 0.33+h1*0.05, 0.155+h2*0.03),
                     sdSph(c-vec3(0.,0.58+h1*0.05,0.), 0.125));
    if(person<d){ d=person; MAT=2.; }
  }
  // the lamp — the one hot source, behind and above the booth
  float lamp=sdSph(p-vec3(0.,0.92,8.30), 0.15);
  if(lamp<d){ d=lamp; MAT=3.; }
  // THE WAVEFORM, as architecture. In the last section the walls grow bars whose
  // height is the envelope of the track — the visualiser's oldest idea, built.
  if(uSec>3.5){
    float slot=0.62;
    float wid=floor(p.z/slot+0.5);
    float lz=p.z-slot*wid;
    float amp=0.20+0.80*abs(0.62*sin(wid*1.71)+0.38*sin(wid*0.53+1.1));
    amp*=0.60+0.40*uSub;                       // and it still breathes with the sub
    vec3 wp=vec3(abs(p.x)-2.95, p.y-(FLOORY+amp*2.45), lz);
    float wbar=sdBox(wp, vec3(0.52, amp*2.45, slot*0.36));
    if(wbar<d){ d=wbar; MAT=7.; }
  }
  return d;
}

// the booth section flies the camera in close, but it is the same room
float map(vec3 p){ return mapRoom(p); }

vec3 nrm(vec3 p){
  vec2 e=vec2(0.0025,0.);
  float d=map(p);
  return normalize(vec3(map(p+e.xyy)-d, map(p+e.yxy)-d, map(p+e.yyx)-d));
}

const vec3 LAMP=vec3(0.,0.92,8.30);

void main(){
  // isotropic screen units: uv is -1..1 on BOTH axes, so x must be scaled by the
  // aspect or the lens stretches. r2 then tops out at ~1.3 in the corners.
  vec2 s=vec2(uv.x*uAspect, uv.y);
  float r2=dot(s,s);
  // THE LENS. Barrel applied to the direction, before marching — so edges bend
  // the way glass bends them and nothing is resampled.
  vec3 rd=normalize(vec3(s*(1.0+uBarrel*r2), 0.92));
  vec3 ro=vec3(0.,-0.10,-6.2);
  float fov=0.92;

  // section camera
  if(uSec<0.5){                                   // booth: in close, low, looking at the deck
    ro=vec3(0., 0.72, 6.62 + 0.10*sin(uT*0.7));    // over the deck, looking down
    fov=0.66;
  } else if(uSec<1.5){                            // room: pull back through the crowd
    ro=vec3(0.,-0.10, mix(3.0,-3.6,smoothstep(0.,1.,uSecP)));
  } else if(uSec<2.5){                            // specimen: locked off, the build
    ro=vec3(0.,-0.10,-3.2);
  } else if(uSec<3.5){                            // drop: pushed in hard
    ro=vec3(0.,-0.10, mix(-3.2,2.6,smoothstep(0.,1.,uSecP)));
  } else {                                        // wave: flying down the room
    ro=vec3(0., 0.05, mix(-1.4,4.2,uSecP));
  }
  rd=normalize(vec3(s*(1.0+uBarrel*r2), fov));
  float cp=cos(uPitch), sp=sin(uPitch);           // tilt after the lens, never before
  rd=vec3(rd.x, rd.y*cp-rd.z*sp, rd.y*sp+rd.z*cp);
  ro+=uShake;

  // ---- march, accumulating haze as we go (this is what makes it a club) ----
  float d=0.0, dist=0.0; vec3 pos=ro; bool hit=false;
  float haze=0.0;
  for(int i=0;i<96;i++){
    pos=ro+rd*d;
    dist=map(pos);
    // cheap in-scattering: the lamp lights the smoke the ray passes through
    float dl=length(pos-LAMP);
    haze += 0.021/(1.0+dl*dl*2.10) * clamp(dist,0.02,0.35);
    if(dist<0.004){ hit=true; break; }
    if(d>34.0) break;
    d+=dist*0.85;
  }
  float mat=MAT;

  vec3 col=vec3(0.);
  vec3 AMBER=vec3(1.0,0.545,0.20);
  if(hit){
    vec3 n=nrm(pos);
    vec3 ld=LAMP-pos; float dl=length(ld); ld/=dl;
    float lam=max(dot(n,ld),0.0)/(1.0+dl*dl*0.16);
    vec3 base;
    if(mat<0.5)      base=vec3(0.30,0.175,0.115);     // plaster
    else if(mat<1.5) base=vec3(0.075,0.042,0.028);    // booth front
    else if(mat<2.5) base=vec3(0.022,0.012,0.008);    // the crowd is silhouette
    else if(mat<3.5) base=vec3(1.0);                  // the lamp itself
    else if(mat<4.5) base=vec3(0.055,0.034,0.024);    // the deck
    else if(mat<5.5) base=vec3(0.115,0.080,0.062);    // the jog wheel platter
    else if(mat<6.5) base=vec3(0.045,0.030,0.024);    // the mixer
    else             base=vec3(0.20,0.12,0.085);      // the waveform bars
    col=base*AMBER*(lam*2.9*uLamp+0.006);
    if(mat>2.5 && mat<3.5) col=AMBER*26.0*uLamp;      // blow it right out
    if(mat>4.5 && mat<5.5){                           // the platter: it TURNS
      vec2 dc=pos.xz-vec2(sign(pos.x)*0.76,7.20);
      float rr=length(dc);
      // a spoke marker going round once per bar — the deck keeps the time
      float ang=atan(dc.y,dc.x)+uT*(6.2831/(4.0*0.46875));
      float spoke=smoothstep(0.25,0.0,abs(mod(ang+PI,6.2831)-PI))*smoothstep(0.285,0.12,rr);
      col+=vec3(1.0,0.42,0.14)*spoke*0.9;
      col+=vec3(1.0,0.34,0.11)*smoothstep(0.020,0.0,abs(rr-0.268))*(0.5+3.2*uKick);
    }
    if(mat>6.5){                                      // the bars light themselves
      col+=AMBER*(0.55+1.30*uSub)*smoothstep(0.55,0.0,abs(abs(pos.x)-2.95));
      col+=vec3(1.0,0.44,0.15)*smoothstep(0.09,0.0,abs(pos.y-(FLOORY+2.0*0.245*10.0*0.0)-pos.y))*0.0;
    }
    if(mat>5.5 && mat<6.5){                           // the mixer's channel lights
      vec2 mp=pos.xz-vec2(0.,7.20);
      float ch=smoothstep(0.026,0.0,abs(mod(mp.x+0.26,0.100)-0.050));
      col+=vec3(1.0,0.50,0.16)*ch*step(abs(mp.y),0.26)*(0.10+1.5*uHigh*uSub);
    }
  }
  // the haze carries the room's colour, and the sub swells it
  col += AMBER*haze*(2.0+1.8*uSub)*uLamp;
  // the lamp's bloom, in screen space, on top of everything
  // project the lamp into the same distorted space the rays live in, so the glow
  // is anchored to the source in every camera. rd ∝ (s·barrel, fov), and the lamp
  // direction ∝ (lv.xy, lv.z) — equal when s·barrel = fov·lv.xy/lv.z.
  vec3 lv=LAMP-ro;
  lv=vec3(lv.x, lv.y*cp+lv.z*sp, -lv.y*sp+lv.z*cp);      // into camera space
  vec2 lpos = lv.z>0.05 ? fov*lv.xy/lv.z : vec2(0.,99.);
  vec2 sd=s*(1.0+uBarrel*r2);
  float bl=length((sd-lpos)*vec2(1.0,1.02));
  col += AMBER*pow(max(0.,1.0-bl*1.75),4.0)*(2.4+2.8*uSub)*uLamp;  // the blown core
  col += AMBER*pow(max(0.,1.0-bl*0.72),3.0)*(0.14+0.26*uSub)*uLamp; // the halo

  // ---- THE PAINT ----------------------------------------------------------
  // Screen-space, thrown from wherever the lamp actually is, one stroke per kick.
  // Each stroke keeps its OWN duration rather than all of them ending together —
  // the lesson 003 paid for, or the earliest strokes crawl and the drop goes soft.
  if(uSec>2.5 && uSec<3.5){
    vec3 OX=vec3(0.55,0.165,0.067), OCH=vec3(0.69,0.478,0.247), CR=vec3(0.86,0.79,0.68);
    float cov=0.0; vec3 pc=vec3(0.);
    for(int i=0;i<18;i++){
      float fi=float(i);
      float h1=hash(vec2(fi,1.7)), h2=hash(vec2(fi,9.3)), h3=hash(vec2(fi,21.1));
      float h4=hash(vec2(fi,33.7)), h5=hash(vec2(fi,47.2));
      float launch=(fi*0.55)/18.0;                  // one stroke per kick, staggered
      // every stroke keeps its OWN duration — 003's lesson: share one and the
      // early strokes crawl and the drop goes soft instead of getting bigger
      float g=clamp((uSecP-launch)/(0.13+0.20*h2),0.0,1.0);
      if(g<=0.0) continue;
      g=g*g*(3.0-2.0*g);
      float ang=h1*6.2831;
      vec2 dir=vec2(cos(ang),sin(ang)), perp=vec2(-dir.y,dir.x);
      // throw distance is a fraction of the room left along THIS heading
      float room=1.0/max(abs(dir.x)/1.05, abs(dir.y)/1.35);
      vec2 orig=lpos+perp*(h4-0.5)*0.10;            // not all from one point
      vec2 tip=orig+dir*room*(0.45+0.75*h3)*g;
      vec2 mid=mix(orig,tip,0.5)+perp*(h5-0.5)*0.34*g;   // the stroke BENDS
      // two segments through the bent midpoint reads as a loaded brush, not a spike
      float dseg=1e9; float hpar=0.0;
      for(int j=0;j<2;j++){
        vec2 A=j==0?orig:mid, Bv=j==0?mid:tip;
        vec2 pa=sd-A, ba=Bv-A;
        float hh=clamp(dot(pa,ba)/max(dot(ba,ba),1e-5),0.0,1.0);
        float dd=length(pa-ba*hh);
        if(dd<dseg){ dseg=dd; hpar=(float(j)+hh)*0.5; }
      }
      // the width runs out along the stroke and the edge is ragged, like bristles
      float band=hash(vec2(floor(hpar*7.0)+fi*13.0, 3.0));
      float rad=(0.068+0.058*h2)*g*(1.0-0.60*hpar)*(0.72+0.50*band);
      rad*=1.0+0.17*sin(hpar*38.0+fi);
      float k=smoothstep(rad,rad*0.42,dseg);
      if(k>cov){ pc = h3<0.50?OX:(h3<0.91?OCH:CR); }
      cov=max(cov,k);
    }
    col=mix(col, pc*(0.80+0.50*uSub), cov*smoothstep(0.0,0.06,uSecP));
  }

  col*=1.0-0.62*r2*r2;                             // hard lens falloff — the corners go
  col=col/(1.0+col*0.80);                          // roll the highlights off
  col=pow(col,vec3(1.18));                         // and crush the toe so black is black
  outc=vec4(pow(max(col,0.0),vec3(0.4545)),1.0);
}`;

function sh(ty,src){
  const o=gl.createShader(ty); gl.shaderSource(o,src); gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o));
  return o;
}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
const ap=gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(ap); gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
const U={};
for(const n of ['uT','uSec','uSecP','uSub','uMid','uHigh','uKick','uRise','uShake','uBarrel','uLamp','uAspect','uPitch'])
  U[n]=gl.getUniformLocation(prog,n);

// deterministic shake: a fixed noise sampled at t, so a re-render matches
function noise1(x){ const i=Math.floor(x), f=x-i;
  const a=Math.sin(i*127.1)*43758.5453, b=Math.sin((i+1)*127.1)*43758.5453;
  const u=f*f*(3-2*f);
  return lerp(a-Math.floor(a), b-Math.floor(b), u)*2-1; }

window.renderFrame=function(t){
  t=Math.max(0,Math.min(DUR-0.0001,t));
  const B=bands(t), sec=sectionAt(t), si=SEC.indexOf(sec);
  const secP=clamp((t-sec.a)/(sec.b-sec.a));

  // the camera shakes on the KICK and the lens breathes on the SUB — two channels,
  // because shaking on everything reads as noise rather than as impact
  const amp=0.052*B.kick*(si===3?1.7:1.0);
  const shake=[noise1(t*47.0)*amp, noise1(t*47.0+19.0)*amp*1.25, noise1(t*31.0+7.0)*amp*0.5];
  const barrel=0.26+0.07*B.sub+(si===0?0.08:0)+(si===4?0.10:0);
  const lamp=(si===2? lerp(1.0,0.35,B.rise) : 1.0)*(si===3? 1.0+0.9*Math.exp(-(t-sec.a)*3.0):1.0);

  gl.uniform1f(U.uT,t); gl.uniform1f(U.uSec,si); gl.uniform1f(U.uSecP,secP);
  gl.uniform1f(U.uSub,B.sub); gl.uniform1f(U.uMid,B.mid); gl.uniform1f(U.uHigh,B.high);
  gl.uniform1f(U.uKick,B.kick); gl.uniform1f(U.uRise,B.rise);
  gl.uniform3f(U.uShake,shake[0],shake[1],shake[2]);
  // the booth looks down at the deck; everything else is level
  const pitch = si===0 ? 0.55 : (si===4 ? -0.04 : 0.0);   // +ve looks down
  gl.uniform1f(U.uPitch,pitch);
  gl.uniform1f(U.uBarrel,barrel); gl.uniform1f(U.uLamp,lamp);
  gl.uniform1f(U.uAspect,W/H);
  gl.viewport(0,0,W,H);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.finish();
  return true;
};
window.DUR=DUR; window.BPM=BPM;
window.renderFrame(0);
</script>
