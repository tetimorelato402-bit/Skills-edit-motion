<meta charset="utf-8">
<title>Anvil — Sit still. Keep up.</title>
<style>
  /* self-hosted, deliberately: this container has come back from restarts with an
     empty /usr/local/share/fonts and a silent DejaVu fallback would not be caught
     until the film was assembled */
  @font-face{font-family:'InterLocal';src:url('fonts/inter.woff2') format('woff2');
             font-weight:100 900;font-display:block}
  @font-face{font-family:'PlexLocal';src:url('fonts/plexmono.woff2') format('woff2');
             font-weight:100 700;font-display:block}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F7F7F5}
  .abs{position:absolute}
</style>
<div id="stage"></div>
<script>
// ============================================================================
// ANVIL — "Sit still. Keep up."
//
// The ad is a reading test. Text types out in a white studio while the film tries
// to pull the viewer's eyes away; the copy's argument is that being able to hold
// attention is the point, so form and argument are the same object.
//
// THE RULE: distractions never obscure the text. They arrive at the edges, they
// move, they offer a second thing to read — but the sentence in the middle stays
// fully legible every frame it is up. Cover the words and the test stops being
// winnable. `SAFE` is the rectangle nothing is allowed to enter.
//
// Same contract as the other films here: one deterministic renderFrame(t).
// ============================================================================
const W=1080, H=1920;
const BPM=120, BEAT=60/BPM, BAR=4*BEAT;        // 0.5, 2.0
const BARS=16, DUR=BARS*BAR;                   // 32.0 s
const bt=n=>n*BEAT, br=n=>(n-1)*BAR;

const stage=document.getElementById('stage');
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,u)=>a+(b-a)*u;
function bez(x1,y1,x2,y2){
  const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx, cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const fx=t=>((ax*t+bx)*t+cx)*t, fy=t=>((ay*t+by)*t+cy)*t, dfx=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{ if(x<=0)return 0; if(x>=1)return 1; let t=x;
    for(let i=0;i<8;i++){const e=fx(t)-x; if(Math.abs(e)<1e-6)break;
      const d=dfx(t); if(Math.abs(d)<1e-6)break; t-=e/d;} return fy(t); };
}
const easeOut=bez(0.16,1,0.3,1), easeInOut=bez(0.65,0,0.35,1);
const backOut=bez(0.28,1.42,0.44,1);
// deterministic noise so a re-render matches frame for frame
function n1(x){ const i=Math.floor(x),f=x-i;
  const h=k=>{const s=Math.sin(k*127.1)*43758.5453; return s-Math.floor(s);};
  const u=f*f*(3-2*f); return lerp(h(i),h(i+1),u)*2-1; }
function hash(i){ const s=Math.sin(i*91.7)*43758.5453; return s-Math.floor(s); }

function el(tag,parent,css,txt){
  const n=document.createElement(tag);
  if(css)Object.assign(n.style,css);
  if(txt!==undefined)n.textContent=txt;
  (parent||stage).appendChild(n); return n;
}
const px=v=>v+'px';

// THE SAFE RECTANGLE — nothing decorative may enter it. Every distraction is
// positioned outside these bounds or clipped to stay out.
const SAFE={x:64, y:640, w:952, h:900};

// ---------------------------------------------------------------- the copy
// Typed at CPS characters per second, which RAMPS: comfortable at the start,
// a genuine push by the end. That escalation is the test.
const PAGES=[
  {bar:2.0,  cps:15, lines:["When you picked your friends,",
                            "you never got to choose between",
                            "who you met first",
                            "and who you met last."]},
  {bar:5.0,  cps:17, lines:["You chose who stayed.",
                            "You chose who got to know",
                            "the real you."]},
  // ---- SLOT: what Anvil actually is. teti is writing this. --------------
  // Placeholder, in the right shape and the right length so the timing holds.
  {bar:7.5,  cps:19, lines:["Anvil is where you do the work",
                            "in front of the people",
                            "who chose to stay.",
                            "One task. Out loud. Together."], slot:true},
  {bar:10.5, cps:22, lines:["So challenge yourself.",
                            "Let them see the real you."]},
];
// THE STOP and the payoff are deliberately NOT the same moment. Everything that
// distracts dies at STOP_BAR; the payoff does not begin typing for another beat.
// That gap is the pivot of the film — with the two tied together the distractions
// vanished and the next sentence started in the same frame, and the silence that
// the whole build exists to earn was never actually heard.
const STOP_BAR=12.5;
const PAYOFF={bar:13.0,  lines:["Don't sit still.","Don't let the distractions win."]};
const CLOSE ={bar:14.5,  lines:["Pick a task.","Choose your friends."]};
const CTA   ={bar:15.25, text:"Download Anvil."};

// ---------------------------------------------------------------- beat 0: the instruction
const instr=el('div','',{position:'absolute',left:px(64),top:px(820),width:px(952),
  fontFamily:"'InterLocal',sans-serif",fontWeight:'800',fontSize:'132px',
  lineHeight:'0.98',letterSpacing:'-0.045em',color:'#0B0B0C'});
const instr1=el('div',instr,{},'SIT STILL.');
const instr2=el('div',instr,{},'KEEP UP.');

// ---------------------------------------------------------------- distractions
// Built FIRST, on purpose. Everything decorative lives behind the type in the
// stacking order, so the rule "distractions never obscure the text" is enforced
// by construction rather than by remembering to tune an opacity. The first pass
// put this layer on top and a two-frame colour flash swallowed the sentence.
const dLayer=el('div','',{position:'absolute',inset:'0',pointerEvents:'none'});
const ACCENT='#FF4A1C';        // placeholder until Anvil's brand colour is known

// drifting dots — the easy, dismissible one
const dots=[];
for(let i=0;i<7;i++) dots.push(el('div',dLayer,{position:'absolute',borderRadius:'50%',
  background:ACCENT,opacity:'0'}));
// slabs entering from the edges, always outside the safe rectangle
const slabs=[];
for(let i=0;i<5;i++) slabs.push(el('div',dLayer,{position:'absolute',background:'#0B0B0C',opacity:'0'}));
// the notification card
const notif=el('div',dLayer,{position:'absolute',left:px(70),width:'640px',height:'150px',
  background:'#FFFFFF',borderRadius:'26px',opacity:'0',
  boxShadow:'0 18px 50px rgba(0,0,0,0.16)',display:'flex',alignItems:'center',
  padding:'0 30px',gap:'22px'});
el('div',notif,{width:'76px',height:'76px',borderRadius:'20px',background:ACCENT,flex:'0 0 auto'});
const notifTxt=el('div',notif,{fontFamily:"'InterLocal',sans-serif",fontSize:'27px',
  fontWeight:'600',color:'#0B0B0C',lineHeight:'1.35'});
notifTxt.innerHTML='<div>3 new messages</div><div style="color:#8A8A93;font-weight:500">tap to open</div>';
// the colour wash — behind the type, and a tint rather than a flood
const flash=el('div',dLayer,{position:'absolute',inset:'0',background:ACCENT,opacity:'0'});

// ---------------------------------------------------------------- the body
// vertically centred on the frame: the line count changes page to page, so the
// block is anchored at its middle and never drifts up the frame as it shortens
const body=el('div','',{position:'absolute',left:px(SAFE.x),top:px(H*0.47),
  width:px(SAFE.w),transform:'translateY(-50%)',
  fontFamily:"'InterLocal',sans-serif",fontWeight:'600',
  fontSize:'80px',lineHeight:'1.26',letterSpacing:'-0.03em',color:'#0B0B0C',
  opacity:'0'});
const bodyLines=[];
for(let i=0;i<5;i++) bodyLines.push(el('div',body,{whiteSpace:'pre',minHeight:'1px'},''));
const caret=el('div','',{position:'absolute',width:'7px',background:'#0B0B0C',opacity:'0'});

// ---------------------------------------------------------------- the decoy
// The strongest distraction in the film: a SECOND thing worth reading. A shape
// only moves; text competes for the same faculty the viewer is being tested on.
const decoy=el('div','',{position:'absolute',right:px(40),top:px(300),width:'420px',
  fontFamily:"'PlexLocal',monospace",fontWeight:'400',fontSize:'30px',lineHeight:'1.5',
  letterSpacing:'-0.01em',color:'#8A8A93',opacity:'0',textAlign:'right'});
const DECOY_TEXT="did you know the average person checks their phone 144 times a day "+
                 "and loses 23 minutes getting back to what they were doing";
// a second decoy, lower and on the other side, for the worst stretch
const decoy2=el('div','',{position:'absolute',left:px(40),top:px(1470),width:'400px',
  fontFamily:"'PlexLocal',monospace",fontWeight:'400',fontSize:'28px',lineHeight:'1.5',
  color:'#9A9AA2',opacity:'0'});
const DECOY2_TEXT="you are still reading this one instead";

// ---------------------------------------------------------------- the end card
const endCard=el('div','',{position:'absolute',inset:'0',background:'#0B0B0C',opacity:'0',
  display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'40px'});
const endMark=el('div',endCard,{fontFamily:"'InterLocal',sans-serif",fontWeight:'800',
  fontSize:'150px',letterSpacing:'-0.05em',color:'#FFFFFF'},'ANVIL');
const endSub=el('div',endCard,{fontFamily:"'InterLocal',sans-serif",fontWeight:'500',
  fontSize:'36px',letterSpacing:'0.22em',color:'#8A8A93'},'PICK A TASK');

// ---------------------------------------------------------------- helpers
function typeInto(nodes, lines, t, start, cps){
  // one continuous character count across the whole page, so the caret walks
  // from line to line the way real typing does
  const n=Math.max(0,Math.floor((t-start)*cps));
  let left=n, lastIdx=0, lastLen=0;
  for(let i=0;i<nodes.length;i++){
    const src=lines[i]||'';
    const take=Math.max(0,Math.min(src.length,left));
    nodes[i].textContent=src.slice(0,take);
    if(take>0){ lastIdx=i; lastLen=take; }
    left-=src.length;
    if(left<0) left=0;
  }
  const total=lines.reduce((a,l)=>a+l.length,0);
  return {done:n>=total, lastIdx, lastLen};
}
// AUTO-FIT. teti is still writing the middle of this film, so the type sizes
// itself to whatever copy is dropped in rather than depending on line breaks
// hand-tuned against one draft. Measures the longest line at the base size and
// scales down until it fits the safe rectangle; cached per page, because the
// measurement is the expensive part and the copy does not change per frame.
const FITC=new Map();
function fitSize(lines, base, weight, tracking){
  const key=base+'|'+weight+'|'+lines.join('\u0001');
  if(FITC.has(key)) return FITC.get(key);
  const probe=document.createElement('div');
  Object.assign(probe.style,{position:'absolute',visibility:'hidden',whiteSpace:'pre',
    left:'-9999px',top:'0',fontFamily:"'InterLocal',sans-serif",
    fontWeight:weight, fontSize:base+'px', letterSpacing:tracking});
  document.body.appendChild(probe);
  let widest=0;
  for(const l of lines){ probe.textContent=l;
    widest=Math.max(widest, probe.getBoundingClientRect().width); }
  probe.remove();
  const size = widest>0 ? Math.min(base, Math.floor(base*(SAFE.w/widest))) : base;
  FITC.set(key,size); return size;
}

function measureCaret(node){
  const r=node.getBoundingClientRect();
  return {x:r.left+r.width, y:r.top, h:r.height};
}

// ============================================================================
window.renderFrame=function(t){
  t=Math.max(0,Math.min(DUR-0.0001,t));

  // ---- the instruction, bar 1 --------------------------------------------
  const iIn=easeOut(clamp((t-bt(0.5))/0.5));
  const iOut=clamp((t-br(2)+0.35)/0.35);
  instr.style.opacity=(iIn*(1-iOut)).toFixed(3);
  instr.style.transform=`translateY(${((1-iIn)*36).toFixed(1)}px)`;
  instr2.style.opacity=easeOut(clamp((t-bt(1.6))/0.4)).toFixed(3);

  // ---- the body: which page is up ---------------------------------------
  let page=null, pStart=0;
  for(const p of PAGES){ if(t>=br(p.bar)) { page=p; pStart=br(p.bar); } }
  const inPayoff=t>=br(PAYOFF.bar);
  const inClose =t>=br(CLOSE.bar);
  const inCTA   =t>=br(CTA.bar);

  let lines=null, start=0, cps=18;
  if(inCTA)        { lines=[CTA.text];       start=br(CTA.bar);    cps=26; }
  else if(inClose) { lines=CLOSE.lines;      start=br(CLOSE.bar);  cps=22; }
  else if(inPayoff){ lines=PAYOFF.lines;     start=br(PAYOFF.bar); cps=20; }
  else if(page)    { lines=page.lines;       start=pStart;         cps=page.cps; }

  if(lines){
    body.style.opacity='1';
    // the payoff and everything after it is bigger — the film stops arguing
    // and starts stating, so the type stops being a paragraph and becomes a line
    const big=inPayoff;
    const wt=big?'800':'600', tr=big?'-0.04em':'-0.03em';
    body.style.fontWeight=wt;
    body.style.lineHeight=big?'1.12':'1.28';
    body.style.letterSpacing=tr;
    body.style.fontSize=fitSize(lines, big?116:88, wt, tr)+'px';
    const r=typeInto(bodyLines,lines,t,start,cps);
    // the caret sits at the end of the last typed line
    if(!r.done){
      const m=measureCaret(bodyLines[r.lastIdx]);
      caret.style.left=px(m.x+6); caret.style.top=px(m.y+m.h*0.12);
      caret.style.height=px(m.h*0.78);
      caret.style.opacity=(Math.floor(t/(BEAT/2))%2===0)?'1':'0.25';
    } else {
      caret.style.opacity=(Math.floor(t/BEAT)%2===0)?'0.85':'0';
    }
  } else {
    body.style.opacity='0'; caret.style.opacity='0';
    bodyLines.forEach(n=>n.textContent='');
  }

  // ---- THE STOP. Bar 13 kills every distraction inside one frame. --------
  // Everything before this exists to make this silence land.
  const STOP=br(STOP_BAR);
  const live=t<STOP;

  // ---- distraction 1: drifting dots, from bar 2 --------------------------
  dots.forEach((d,i)=>{
    const on=live && t>=br(2)+i*0.55;
    if(!on){ d.style.opacity='0'; return; }
    const age=t-(br(2)+i*0.55);
    const sp=26+hash(i)*44;
    const size=10+hash(i+9)*26;
    // they travel across the TOP and BOTTOM bands only — never the safe rect
    const topBand=hash(i+3)<0.5;
    const y=topBand? 120+hash(i+5)*380 : SAFE.y+SAFE.h+70+hash(i+5)*300;
    const x=((hash(i+1)*W + age*sp) % (W+240))-120;
    d.style.width=px(size); d.style.height=px(size);
    d.style.left=px(x); d.style.top=px(y+n1(t*0.7+i)*14);
    d.style.opacity=(0.25+0.5*hash(i+7)).toFixed(2);
  });

  // ---- distraction 2: slabs from the edges, bars 4+ ----------------------
  slabs.forEach((s,i)=>{
    const at=br(4)+i*bt(3);
    const on=live && t>=at && t<at+1.5;
    if(!on){ s.style.opacity='0'; return; }
    const u=easeInOut(clamp((t-at)/1.5));
    const fromLeft=i%2===0;
    const h=90+hash(i)*130;
    // pinned to the bands above and below the safe rectangle
    const y=(i%2===0)? 150+hash(i+2)*300 : SAFE.y+SAFE.h+120+hash(i+2)*260;
    const w=340+hash(i+4)*300;
    const x=fromLeft? lerp(-w,W+40,u) : lerp(W,-w-40,u);
    s.style.width=px(w); s.style.height=px(h);
    s.style.left=px(x); s.style.top=px(y);
    s.style.opacity='0.92';
  });

  // ---- distraction 3: the colour flash, two frames on a beat -------------
  const FLASHES=[br(5), br(6)+bt(2), br(8)+bt(1), br(9)+bt(3), br(11), br(11)+bt(2), br(12)+bt(1)];
  let fl=0;
  if(live) for(const f of FLASHES) if(t>=f && t<f+0.10) fl=0.16;
  flash.style.opacity=fl.toFixed(2);

  // ---- distraction 4: the notification, bar 6 ----------------------------
  const nAt=br(6)+bt(1), nUp=live && t>=nAt && t<nAt+2.6;
  if(nUp){
    const u=backOut(clamp((t-nAt)/0.45));
    const out=clamp((t-(nAt+2.1))/0.5);
    notif.style.top=px(lerp(H+40, H-260, u));
    notif.style.opacity=(1-out).toFixed(3);
    notif.style.transform=`translateY(${(out*120).toFixed(0)}px)`;
  } else notif.style.opacity='0';

  // ---- distraction 5: THE DECOY TEXT, bars 8-12 --------------------------
  // The hardest one to ignore, and the reason the film works: it is not motion,
  // it is a second thing worth reading.
  const dAt=br(8);
  if(live && t>=dAt){
    const n=Math.floor((t-dAt)*15);
    decoy.textContent=DECOY_TEXT.slice(0,n);
    decoy.style.opacity=clamp((t-dAt)/0.4).toFixed(3);
  } else { decoy.style.opacity='0'; }
  const d2At=br(10)+bt(2);
  if(live && t>=d2At){
    const n=Math.floor((t-d2At)*13);
    decoy2.textContent=DECOY2_TEXT.slice(0,n);
    decoy2.style.opacity=clamp((t-d2At)/0.4).toFixed(3);
  } else { decoy2.style.opacity='0'; }

  // ---- distraction 6: the frame itself starts moving, bars 11-12 ---------
  let shake=0;
  if(live && t>=br(11)) shake=clamp((t-br(11))/(STOP-br(11)))*12;
  stage.style.transform = shake>0
    ? `translate(${(n1(t*23)*shake).toFixed(1)}px,${(n1(t*23+11)*shake*0.7).toFixed(1)}px)`
    : 'none';

  // ---- the end card: it CUTS, it does not fade ---------------------------
  const cut=br(CTA.bar)+bt(2.5);
  endCard.style.opacity = t>=cut ? '1' : '0';
  if(t>=cut){
    const u=easeOut(clamp((t-cut)/0.5));
    endMark.style.transform=`scale(${lerp(0.94,1,u)})`;
    endMark.style.opacity=u.toFixed(3);
    endSub.style.opacity=easeOut(clamp((t-cut-0.25)/0.5)).toFixed(3);
  }
  return true;
};
window.DUR=DUR; window.BPM=BPM;
window.renderFrame(0);
</script>
