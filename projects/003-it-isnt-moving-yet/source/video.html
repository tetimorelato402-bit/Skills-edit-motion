<meta charset="utf-8">
<title>It isn't moving yet — gate: frame 0 + the bloom</title>
<style>
  /* Self-hosted, not resolved through fontconfig. 001 references Inter by
     family name, which silently falls back to sans-serif on any machine that
     doesn't have it installed system-wide — and then every measured line width
     is wrong. The woff2 files are committed next to this file. */
  @font-face{font-family:'Inter';src:url('fonts/inter.woff2') format('woff2');
             font-weight:100 900;font-style:normal;font-display:block}
  @font-face{font-family:'PlexMono';src:url('fonts/plexmono.woff2') format('woff2');
             font-weight:500;font-style:normal;font-display:block}
  :root{
    --cream:#EFE3CC;    /* parchment — the ground */
    --ink:#2B100A;      /* warm near-black — the type */
    --signal:#A8341A;   /* the send button, and the second "alive" */
    --grey:#8B8475;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream)}
  body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:absolute;inset:0;overflow:hidden}
  .fill{position:absolute;inset:0}
</style>

<div id="stage"></div>

<script>
// ===========================================================================
//  "It isn't moving yet" — the master.
//
//  GATE BUILD. Only two things exist in this file: frame 0 (the cover, the
//  cold open and the loop point) and THE BLOOM (the hero). Nothing else is
//  written until both are approved — the bloom is the one moment the whole
//  film is judged on, and building five techniques on top of a bloom that
//  doesn't detonate would be five techniques wasted.
//
//  The question, and it is the only sustained type in the finished film:
//      how do you make ideas that aren't alive, alive?
//  It is never answered on screen. By the time it comes back at the end the
//  viewer has answered it themselves, which is the entire point.
// ===========================================================================

// ---- the grid -------------------------------------------------------------
// Same 125 BPM room as Study 001, so sound.py and the beat helpers transfer
// with no conversion. A beat is 0.48s, a bar 1.92s. Every event below is
// written in bt(), never in seconds.
const BPM=125, BEAT=60/BPM, BAR=4*BEAT;     // 0.48, 1.92
const bt=n=>n*BEAT;
const SIXTEENTH=BEAT/4;                      // 0.12 — the smallest legal unit

const CLICK   = bt(2);          // 0.96 — the cursor presses send. This IS the drop.
const BLOOM   = [bt(2), bt(5)]; // 0.96 -> 2.40, the detonation
const DUR     = bt(6);          // the gate render is one and a half bars
window.DUR = DUR;

// ---- easing ---------------------------------------------------------------
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const easeOut =u=>1-Math.pow(1-u,3);
const easeOutQ=u=>1-Math.pow(1-u,5);      // the bloom: enormous initial speed
const easeInOut=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;

// ---- deterministic noise --------------------------------------------------
// The bloom must be identical on every render. Math.random() is not.
let _s=20260902;
const rnd=()=>{_s=(_s*1664525+1013904223)%4294967296; return _s/4294967296;};
const rng=(a,b)=>a+(b-a)*rnd();

const px=v=>v+'px';
function el(tag,parent,style,text){
  const d=document.createElement(tag);
  if(style) Object.assign(d.style,style);
  if(text!==undefined) d.textContent=text;
  parent.appendChild(d); return d;
}

const stage=document.getElementById('stage');

// ===========================================================================
//  GROUND — canvas weave over parchment. The surface never changes anywhere
//  in this film; it is the thing that holds five different palettes together.
// ===========================================================================
// weave.png is a 360px TILE. Stretching it to 1080x1920 turns a canvas weave
// into gingham and, multiplied hard, drags the cream ground from 239 down to
// about 190 — the parchment stops being parchment. Native size, repeated, at
// 001's recipe: multiply for the shadow side, overlay for the tooth.
const ground=el('div',stage,{position:'absolute',inset:'0',background:'var(--cream)'});
el('div',ground,{position:'absolute',inset:'0',backgroundImage:"url('tex/weave.png')",
  backgroundRepeat:'repeat',mixBlendMode:'multiply',opacity:'0.30'});
el('div',ground,{position:'absolute',inset:'0',backgroundImage:"url('tex/weave.png')",
  backgroundRepeat:'repeat',mixBlendMode:'overlay',opacity:'0.14'});

// ===========================================================================
//  FRAME 0 — the cover.
//
//  This has to survive one specific test: it must NOT read as a screenshot.
//  The named failure mode for this whole film is "I asked AI to..." content,
//  and a chat box is the fastest way to land in that genre. So the question is
//  set at title scale in the film's own face, on the film's own painted ground,
//  and the interface is reduced to the two things that carry the meaning — a
//  caret and a send button. No panel, no chrome, no border, no product.
//
//  The word "alive" appears twice. The second one is in signal. That is the
//  whole film in a single still, and it is also the profile cover.
// ===========================================================================
const M=84;                       // the house margin, same as 001
const QSIZE=132, QLEAD=1.02;
const QTOP=980;

// MICRO eyebrow, top left. Present the whole film, never animated — it anchors
// the top of a frame that is otherwise deliberately, editorially empty.
el('div',stage,{position:'absolute',left:px(M),top:px(96),color:'var(--grey)',
  fontFamily:"'PlexMono',monospace",fontSize:'22px',fontWeight:'500',
  letterSpacing:'0.22em',textTransform:'uppercase'},'a question');

const qWrap=el('div',stage,{position:'absolute',left:px(M),top:px(QTOP),width:px(1080-M*2)});
const QLINES=[
  [['how do you','ink']],
  [['make ideas','ink']],
  [["that aren't",'ink']],
  [['alive, ','ink'],['alive?','signal']],   // the turn happens inside the last line
];
const qLineEls=QLINES.map(parts=>{
  // width:'fit-content' is load-bearing: a flex line at full container width
  // reports 912px from getBoundingClientRect, and the caret — measured off it —
  // lands 300px to the right of the text it is supposed to follow.
  const line=el('div',qWrap,{display:'flex',alignItems:'baseline',whiteSpace:'pre',
    width:'fit-content',
    fontSize:px(QSIZE),fontWeight:'800',letterSpacing:'-0.045em',lineHeight:String(QLEAD)});
  parts.forEach(([txt,tone])=>el('span',line,{color:tone==='signal'?'var(--signal)':'var(--ink)'},txt));
  return line;
});

// The caret sits on the baseline of the last line, where a cursor would be.
const caret=el('div',stage,{position:'absolute',width:'9px',background:'var(--ink)',
  opacity:'0.85'});

// The send button. Recognisable but unbranded — the shape everybody knows, in
// the film's own signal colour rather than anybody's brand orange. It is the
// origin of the bloom, so it is placed first and everything else is measured
// from it.
const BTN=96, BTNX=1080-M-BTN, BTNY=QTOP+QLINES.length*QSIZE*QLEAD+66;
const btn=el('div',stage,{position:'absolute',left:px(BTNX),top:px(BTNY),
  width:px(BTN),height:px(BTN),borderRadius:'26px',background:'var(--signal)',
  display:'flex',alignItems:'center',justifyContent:'center'});
btn.innerHTML='<svg width="44" height="44" viewBox="0 0 44 44" fill="none">'+
  '<path d="M22 34V10M22 10L11 21M22 10L33 21" stroke="#EFE3CC" stroke-width="5" '+
  'stroke-linecap="round" stroke-linejoin="round"/></svg>';

// a hairline rule under the type block: the only thing suggesting a field
const rule=el('div',stage,{position:'absolute',left:px(M),width:px(1080-M*2-BTN-40),
  top:px(BTNY+BTN-2),height:'3px',background:'var(--ink)',opacity:'0.18'});

// the signature, MICRO, bottom left — present the whole film, never animated
el('div',stage,{position:'absolute',left:px(M),top:px(1804),color:'var(--grey)',
  fontFamily:"'PlexMono',monospace",fontSize:'22px',fontWeight:'500',
  letterSpacing:'0.22em',textTransform:'uppercase'},'teti — motion');

// ===========================================================================
//  THE BLOOM.
//
//  Everything about this is built to answer one objection: a bloom is a
//  transition, and a transition is not a message. So it is not a wipe, not a
//  gradient and not a filter — it is PAINT, detonating out of the button.
//
//  Each petal is a disc with a bristled radial edge: a fixed 96-point profile,
//  generated once, scaled by the petal's radius. That is the same trick as
//  001's paint wipe (a clip-path polygon, never a filter) for the same reason
//  — the edge breaks up without the contents bending, and it costs nothing per
//  frame. Over the petals sit the oil plates, so the colour reads as thick
//  paint rather than as flat vector fill.
//
//  This is the one moment the film leaves the warm family. Nine petals, nine
//  colours, staggered a sixteenth apart so the bloom arrives in waves rather
//  than as one expanding circle.
// ===========================================================================
const NPROF=96;

// This is the one moment in the film that leaves the warm family — and it still
// has to look like teti's paint box, not a colour wheel. An even spread of
// twelve hues read as pride bunting; the cools have to be the ACCENT inside a
// warm detonation, so the list is weighted eight warm to four cool and the
// magenta that dominated the first pass is down to one entry.
// Split explicitly rather than sliced. Parchment sat in the warm half, drew a
// 500px petal in the middle of the frame and read as a HOLE punched in the
// paint rather than as paint — the light tones have to be small or they stop
// being highlights and start being gaps.
const WARM=['#A8341A','#D8452A','#B8843A','#C2502F','#8E3218',
            '#9A4A22','#B5471F','#C96A2B'];
const COOL=['#1F5F6B','#2C5FA8','#3F7A3A','#7A2E52','#E8B25C','#D9C08A'];

// A bristled radial profile. Four octaves: the low ones carry the silhouette,
// the high ones break the edge the way a loaded brush does. Three octaves read
// as torn paper at this scale — the fourth is what makes it paint.
// Frequencies are high on purpose. Amplitude is relative to radius, so a 0.15
// lobe at f=3 on a 400px petal is a 60px scallop — at frame scale that reads as
// torn paper, which is exactly what the first pass looked like. Pushing the
// octaves up (5/11/23/41) keeps the same total deviation but spends it on
// bristle-scale detail instead of on big geometric lobes.
function profile(){
  const lobes=[[rng(0.08,0.14),rng(0,6.28),5],[rng(0.055,0.10),rng(0,6.28),11],
               [rng(0.03,0.06),rng(0,6.28),23],[rng(0.016,0.034),rng(0,6.28),41]];
  const p=[];
  for(let i=0;i<NPROF;i++){
    const a=i/NPROF*Math.PI*2;
    let v=1;
    for(const [amp,ph,f] of lobes) v+=amp*Math.sin(a*f+ph);
    p.push(v*rng(0.97,1.03));
  }
  return p;
}

// The bloom has to reach the far corner of the frame from the button.
const CX=BTNX+BTN/2, CY=BTNY+BTN/2;
const REACH=Math.hypot(Math.max(CX,1080-CX), Math.max(CY,1920-CY))*1.15;

// THE SPRAY.
//
// The first build of this was nine concentric discs, each big enough to fill
// the frame. By the halfway point they had all engulfed it and the result was
// four flat colour fields stacked like torn paper — no origin, no radiation,
// no bloom. What makes it read as paint thrown out of a button is that no
// single petal covers the frame: thirty of them LAUNCH along their own
// direction, each one small, each one elongated along its travel, so the eye
// sees a cluster radiating outward and a dozen colours at once.
// More petals, each SMALLER. A petal big enough to span the frame contributes a
// straight edge (the frame clips it), and with a halo behind it that straight
// edge arrives twice, a few percent apart — which is what the horizontal bands
// in the previous pass were. Fifty-two small ones cover the same area with no
// single shape large enough to show the frame's own border.
const NP=66;
const petals=[];
for(let i=0;i<NP;i++){
  // Angles are biased into the frame — the button sits low and right, so most
  // of the paint has to travel up and left, but not all of it, or the burst
  // reads as a fan instead of a detonation.
  const ang = (i/NP)*Math.PI*2 + rng(-0.10,0.10);
  // The bloom used to own the frame by 1.50s and then had nine tenths of a
  // second with nothing left to do. Spreading the launches out to 0.82 of the
  // window, and shrinking every late petal, keeps paint arriving ON TOP of
  // paint right to the end — a second wave instead of a plateau.
  const lag = rng(0, 0.82);
  petals.push({
    ang,
    // dist must stay well under rad's reach. Thrown 0.88 of the way to the far
    // corner while only growing to 0.42, a petal ends the bloom OUTSIDE the
    // frame — so the paint peaked halfway through and then visibly receded,
    // and the ones still crossing the border drew straight edges along it.
    dist:  rng(0.04,0.45)*REACH,   // how far it is thrown
    rad:   rng(0.12,0.30)*REACH*(1-0.55*lag),  // late arrivals are small
    lag,
    elong: rng(1.0,2.3),           // stretched along its own travel — a tendril
    op:    rng(0.86,1.0),
    prof:  profile(),
  });
}
// Biggest first, so the small bright ones stay on top and the colour count the
// viewer actually perceives stays high.
petals.sort((a,b)=>b.rad-a.rad);

// Colour by SIZE, not at random: the big petals take the warm end of the list
// and the cools land only on small ones. Left to chance, a plum or a magenta
// draws a 500px petal and the detonation stops looking like teti's paint box.
// The accent colours are accents — that has to be true here too.
petals.forEach((p,i)=>{
  p.c = i < NP*0.55 ? WARM[i%WARM.length] : (i%3===0 ? COOL[i%COOL.length] : WARM[i%WARM.length]);
});

// The wash: one large, slow, bristled shape under the entire spray. It is what
// guarantees the frame is covered by the end without any small petal having to
// be big enough to show a straight edge. Drawn first, so it is the GROUND of
// the bloom rather than a disc competing with it.
const wash={c:'#8E3218', ang:Math.atan2(960-CY,540-CX), dist:REACH*0.42,
            rad:REACH*1.15, elong:1.15, op:1, lag:0.18, prof:profile()};

// Every petal is drawn twice: a translucent HALO a few percent larger, then the
// petal itself. Real paint does not have a hard edge, and a blur cannot be used
// here — 001 already paid for that lesson, a full-frame filter costs ~0.4s per
// frame and there are fifty-two of these. Two clipped layers cost nothing and
// give the edge somewhere to fall off.
//
// THE PAINT SKIN IS GLOBAL, NOT PER PETAL, and that is not a stylistic choice.
// The first build gave every petal its own copy of the oil plate and the weave
// and marked each one will-change:clip-path. That is 212 full-frame layers, a
// 1080x1920 plate decoded into each of them, and roughly 900MB of compositor
// memory — well past what Chromium will hold. It does not error: it silently
// stops applying updates, and screenshots come back showing an ARBITRARY
// EARLIER STATE. The bloom appeared to grow, recede, and at 2.40s render as
// frame 0 with no paint at all. Nothing in the page reported a problem.
//
// The plate is identical in every petal anyway, so one skin over the whole
// bloom is visually the same thing for a hundredth of the cost. Its opacity
// rides the bloom's own progress, so it is absent while the frame is still
// clean parchment and full once the paint owns the frame.
const bloomLayer=el('div',stage,{position:'absolute',inset:'0'});
for(const p of [wash,...petals]){
  p.halo=el('div',bloomLayer,{position:'absolute',inset:'0',background:p.c,opacity:'0'});
  p.node=el('div',bloomLayer,{position:'absolute',inset:'0',background:p.c,opacity:'0'});
}
const skinPlate=el('div',bloomLayer,{position:'absolute',inset:'0',
  backgroundImage:"url('tex/plate_paper.png')",backgroundSize:'1080px 1920px',
  mixBlendMode:'overlay',opacity:'0'});
const skinWeave=el('div',bloomLayer,{position:'absolute',inset:'0',
  backgroundImage:"url('tex/weave.png')",backgroundRepeat:'repeat',
  mixBlendMode:'multiply',opacity:'0'});

// The ignition core: a bright parchment flash at the button for one sixteenth.
// A detonation without a hot centre reads as a wipe.
const core=el('div',stage,{position:'absolute',borderRadius:'50%',
  background:'#FFF6E4',opacity:'0'});

// A petal's polygon at progress u. Computed in the petal's own frame, where +x
// is its direction of travel, then rotated into place — that is what lets a
// petal stretch along its path instead of just getting rounder.
// `grow` is easeOut (cubic), not easeOutQ. The first pass used a quintic, which
// puts a petal 67% of the way out by the time it is a fifth through its window
// — so the paint was everywhere before the eye could see where it came from,
// and the button stopped being the origin of anything.
function petalPath(p, u, scale){
  const e=easeOut(u);
  const cx=CX+Math.cos(p.ang)*p.dist*e, cy=CY+Math.sin(p.ang)*p.dist*e;
  const R=p.rad*e*(scale||1), ca=Math.cos(p.ang), sa=Math.sin(p.ang);
  const pts=[];
  for(let i=0;i<NPROF;i++){
    const a=i/NPROF*Math.PI*2, r=R*p.prof[i];
    const lx=Math.cos(a)*r*p.elong, ly=Math.sin(a)*r;
    pts.push(px(Math.round(cx+lx*ca-ly*sa))+' '+px(Math.round(cy+lx*sa+ly*ca)));
  }
  return 'polygon('+pts.join(',')+')';
}

// ===========================================================================
//  renderFrame — one deterministic function of t. No CSS animation anywhere:
//  CSS animations are wall-clock based and would not render reproducibly.
// ===========================================================================
window.renderFrame = function(t){

  // --- frame 0 -------------------------------------------------------------
  // The caret does not blink. A blinking cursor is wall-clock UI behaviour and
  // it would put a moving element in the cover frame; this frame is the only
  // stillness in the film and it earns the pause.
  const lastLine=qLineEls[qLineEls.length-1];
  caret.style.left = px(M + lastLine.getBoundingClientRect().width + 14);
  caret.style.top  = px(QTOP + (QLINES.length-1)*QSIZE*QLEAD + QSIZE*0.14);
  caret.style.height = px(QSIZE*0.80);

  // The press: the button takes the click physically — down fast, and it never
  // comes back up, because the bloom takes it.
  const press = seg(t, CLICK-0.06, CLICK);
  const s = 1 - 0.10*easeOut(press);
  btn.style.transform = `scale(${s.toFixed(4)})`;

  // --- the bloom -----------------------------------------------------------
  const span = BLOOM[1]-BLOOM[0];
  for(const p of [wash,...petals]){
    const u = seg(t, BLOOM[0]+p.lag*span, BLOOM[1]);
    if(u<=0){ p.node.style.opacity='0'; p.halo.style.opacity='0'; continue; }
    p.halo.style.clipPath = petalPath(p, u, 1.04);
    p.halo.style.opacity  = String(p.op*0.28);
    p.node.style.clipPath = petalPath(p, u, 1);
    p.node.style.opacity  = String(p.op);
  }

  // the paint skin rides the bloom's own progress
  const bp = seg(t, BLOOM[0], BLOOM[0]+span*0.55);
  skinPlate.style.opacity = String(0.50*bp);
  skinWeave.style.opacity = String(0.22*bp);

  // the hot centre — one sixteenth, then gone under the paint
  const ig = seg(t, CLICK, CLICK+SIXTEENTH*0.7);
  const cr = 34 + 130*easeOut(ig);
  core.style.left=px(CX-cr); core.style.top=px(CY-cr);
  core.style.width=px(cr*2); core.style.height=px(cr*2);
  core.style.opacity = String(ig>0 ? (1-ig)*0.9 : 0);

  // The type and the button are UNDER the paint, and that is the whole
  // mechanism: the bloom SWALLOWS the question, it does not cross-fade with it.
  // The first pass faded the type out over half a beat and the result was a
  // frame of empty cream with a small paint cluster in the corner — the
  // question had already gone before the paint arrived to take it. Ordering is
  // by DOM position, so occlusion needs no z-index and no opacity at all.
};

renderFrame(0);
</script>
