<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932"><rect width="430" height="932" fill="#E7E0D2"/><rect x="0" y="0" width="430" height="56" fill="#E7E0D2"/><line x1="0" y1="56" x2="430" y2="56" stroke="#D8CFBE"/><g transform="translate(30,28) scale(0.3) translate(-40,-32)" opacity="1"><path d="M8 20 L72 20 L62 30 L50 30 L50 40 L56 52 L24 52 L30 40 L30 30 L18 30 Z" fill="#15130E"/><rect x="34" y="40" width="12" height="14" fill="#15130E"/></g><text x="48" y="35" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" letter-spacing="3" fill="#15130E">ANVIL</text><text x="114" y="34" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" fill="#8B8475">▾</text><text x="412" y="34" font-family="'DM Mono','Courier New',monospace" font-size="12" fill="#8B8475" text-anchor="end">Hi, Matheus</text><text x="20" y="100" font-family="'DM Mono','Courier New',monospace" font-size="11" letter-spacing="2" fill="#8B8475">PROOF, NOT WORDS</text><rect x="18" y="112" width="394" height="230" rx="18" fill="#F2EDE4" stroke="#D8CFBE"/><g transform="translate(215.0,178) scale(0.3) translate(-40,-32)" opacity="1"><path d="M8 20 L72 20 L62 30 L50 30 L50 40 L56 52 L24 52 L30 40 L30 30 L18 30 Z" fill="#D8CFBE"/><rect x="34" y="40" width="12" height="14" fill="#D8CFBE"/></g><text x="215.0" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#15130E" text-anchor="middle">Quiet in here</text><text x="215.0" y="256" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8B8475" text-anchor="middle">When your circle shows up, their proof</text><text x="215.0" y="276" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8B8475" text-anchor="middle">lands here. It fades once everyone has</text><text x="215.0" y="296" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8B8475" text-anchor="middle">seen it.</text><rect x="18" y="848